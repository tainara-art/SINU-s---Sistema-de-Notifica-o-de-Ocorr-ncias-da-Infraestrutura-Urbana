<section class="container auth-section">
  <div class="auth-aside glass-card">
    <span class="eyebrow">SINU's</span>
    <h2>Cidade mais organizada, gestão mais acessível.</h2>
    <p>Interface criada para cidadãos, prefeituras e secretarias acompanharem ocorrências com facilidade.</p>

    <svg width="100%" viewBox="0 0 680 320" role="img">
      <title>Ilustração SINU's</title>
      <desc>Ícones flutuantes representando Prefeitura, Secretaria e Cidadão lado a lado</desc>
      <defs>
        <style>
          .f1{animation:f1 4s ease-in-out infinite}
          .f2{animation:f2 4.8s ease-in-out infinite}
          .f3{animation:f3 3.9s ease-in-out infinite}
          @keyframes f1{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
          @keyframes f2{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
          @keyframes f3{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
        </style>
      </defs>

      <!-- Card Prefeitura -->
      <g class="f1" style="transform-origin:120px 160px">
        <rect x="20" y="30" width="180" height="230" rx="24" fill="#cfe9dd" stroke="rgba(255,255,255,0.9)" stroke-width="1.5"/>
        <rect x="68" y="130" width="64" height="105" rx="5" fill="#6da28f"/>
        <rect x="78" y="113" width="44" height="22" rx="4" fill="#4e8a74"/>
        <rect x="96" y="102" width="10" height="16" rx="2" fill="#4e8a74"/>
        <rect x="74" y="142" width="13" height="13" rx="3" fill="white" opacity="0.8"/>
        <rect x="94" y="142" width="13" height="13" rx="3" fill="white" opacity="0.8"/>
        <rect x="114" y="142" width="13" height="13" rx="3" fill="white" opacity="0.8"/>
        <rect x="74" y="162" width="13" height="13" rx="3" fill="white" opacity="0.8"/>
        <rect x="114" y="162" width="13" height="13" rx="3" fill="white" opacity="0.8"/>
        <rect x="90" y="188" width="20" height="47" rx="4" fill="#3a7a5c"/>
        <text x="110" y="282" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#2f6150">Prefeitura</text>
      </g>

      <!-- Card Secretaria -->
      <g class="f2" style="transform-origin:340px 150px">
        <rect x="250" y="20" width="180" height="230" rx="24" fill="#d7ecf7" stroke="rgba(255,255,255,0.9)" stroke-width="1.5"/>
        <rect x="272" y="125" width="136" height="105" rx="5" fill="#7ab3d4"/>
        <rect x="280" y="107" width="120" height="22" rx="4" fill="#5a96bc"/>
        <rect x="280" y="137" width="14" height="14" rx="3" fill="white" opacity="0.8"/>
        <rect x="302" y="137" width="14" height="14" rx="3" fill="white" opacity="0.8"/>
        <rect x="324" y="137" width="14" height="14" rx="3" fill="white" opacity="0.8"/>
        <rect x="346" y="137" width="14" height="14" rx="3" fill="white" opacity="0.8"/>
        <rect x="280" y="158" width="14" height="14" rx="3" fill="white" opacity="0.8"/>
        <rect x="302" y="158" width="14" height="14" rx="3" fill="white" opacity="0.8"/>
        <rect x="324" y="158" width="14" height="14" rx="3" fill="white" opacity="0.8"/>
        <rect x="346" y="158" width="14" height="14" rx="3" fill="white" opacity="0.8"/>
        <rect x="322" y="185" width="36" height="45" rx="4" fill="#3a7aaa"/>
        <text x="340" y="282" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#2a5f8a">Secretaria</text>
      </g>

      <!-- Card Cidadão -->
      <g class="f3" style="transform-origin:560px 160px">
        <rect x="480" y="30" width="180" height="230" rx="24" fill="#fff7e8" stroke="rgba(255,255,255,0.9)" stroke-width="1.5"/>
        <circle cx="570" cy="115" r="32" fill="#d4956a"/>
        <circle cx="559" cy="110" r="4" fill="white" opacity="0.9"/>
        <circle cx="581" cy="110" r="4" fill="white" opacity="0.9"/>
        <path d="M559 123 Q570 133 581 123" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <rect x="562" y="145" width="16" height="14" rx="3" fill="#c4845a"/>
        <rect x="532" y="157" width="76" height="68" rx="14" fill="#6da28f"/>
        <rect x="508" y="160" width="26" height="14" rx="7" fill="#6da28f"/>
        <rect x="606" y="160" width="26" height="14" rx="7" fill="#6da28f"/>
        <circle cx="506" cy="167" r="8" fill="#d4956a"/>
        <circle cx="634" cy="167" r="8" fill="#d4956a"/>
        <circle cx="610" cy="92" r="17" fill="#e05c2a"/>
        <text x="610" y="99" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" fill="white">!</text>
        <text x="570" y="282" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#9a6035">Cidadão</text>
      </g>

      <!-- Linhas de conexão -->
      <line x1="202" y1="155" x2="248" y2="150" stroke="#8fb9a8" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.7"/>
      <line x1="432" y1="150" x2="478" y2="155" stroke="#8fb9a8" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.7"/>
    </svg>
  </div>

  <div class="form-card">
    <span class="eyebrow">{{ subtitulo }}</span>
    <h1>{{ titulo }}</h1>
    <form method="post" class="stack-form">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}
        <label>{{ field.label }}{{ field }}{% if field.errors %}<small>{{ field.errors|striptags }}</small>{% endif %}</label>
      {% endfor %}
      <button class="btn btn-primary" type="submit">{{ botao }}</button>
      <a class="muted-link" href="{% url extra_url %}" style="text-align: center; display: block;">{{ extra_link }}</a>
    </form>
  </div>
</section>
